name: lshare
description: "LShare - Transfer file & clipboard sync antar device via WiFi lokal"
publish_to: 'none'

version: 1.1.3+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.0
  bonsoir: ^7.1.0
  dio: ^5.4.3
  web_socket_channel: ^3.0.1

  # File & Storage
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  open_filex: ^4.3.4
  device_info_plus: ^10.1.0
  flutter_background: ^1.3.1
  receive_sharing_intent: ^1.8.1

  # UI & Utils
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  crypto: ^3.0.3
  mime: ^1.0.5
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    icon_size: 256
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FDFDFD"
  image: "assets/icon.png"
  android_12:
    color: "#FDFDFD"
    image: "assets/icon.png"
